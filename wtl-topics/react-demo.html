<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WTL Topics 8 & 9: React Component, Props, State & Hooks</title>
  
  <!-- React 18 and Babel from CDN (No build tool needed!) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="stylesheet" href="../style.css">
</head>
<body style="padding: 2rem;">

  <div style="max-width: 800px; margin: 0 auto;">
    <header style="margin-bottom: 2rem; text-align: center;">
      <h1>WTL Topics 8 & 9: React Demonstration</h1>
      <p style="color: var(--text-muted);">
        A minimal Single Page Application demonstrating JSX, Functional Components, Props, State (<code>useState</code>), Hooks (<code>useEffect</code>), Event Handling, and Conditional Rendering.
      </p>
    </header>

    <!-- React Mount Root -->
    <div id="react-root"></div>

    <div style="margin-top: 2rem; text-align: center;">
      <a href="../index.html" class="btn secondary-btn">← Back to Main Dashboard</a>
    </div>
  </div>

  <!-- React Code with Babel JSX Transformation -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // 1. CHILD COMPONENT: Demonstrates Props & Conditional Rendering
    function StockCard(props) {
      const isPositive = props.change >= 0;

      return (
        <div className="stock-card" style={{ marginBottom: '1rem' }}>
          <div className="card-top">
            <span className="stock-symbol">{props.symbol}</span>
            <span className={`stock-change ${isPositive ? 'positive' : 'negative'}`}>
              {isPositive ? '+' : ''}{props.change}%
            </span>
          </div>
          <p className="stock-name">{props.company}</p>
          <div className="card-pricing">
            <span className="stock-price">${props.price.toFixed(2)}</span>
            
            {/* Conditional Rendering using ternary operator */}
            {props.isWatched ? (
              <span style={{ color: '#34d399', fontSize: '0.85rem' }}>★ On Watchlist</span>
            ) : (
              <span style={{ color: '#94a3b8', fontSize: '0.85rem' }}>Not Tracked</span>
            )}
          </div>
          
          <button 
            type="button" 
            className="btn primary-btn" 
            onClick={() => props.onToggleWatch(props.id)}
            style={{ marginTop: '0.5rem' }}
          >
            {props.isWatched ? 'Remove from Watchlist' : 'Add to Watchlist'}
          </button>
        </div>
      );
    }

    // 2. MAIN APP COMPONENT: Demonstrates State (useState) and Lifecycle (useEffect)
    function StockPulseReactApp() {
      // State 1: Stock items array
      const [stocks, setStocks] = useState([
        { id: 101, symbol: 'NVDA', company: 'NVIDIA Corp.', price: 128.50, change: 4.20, isWatched: false },
        { id: 102, symbol: 'TSLA', company: 'Tesla Inc.', price: 218.40, change: -1.80, isWatched: true }
      ]);

      // State 2: Simulation tick counter
      const [secondsActive, setSecondsActive] = useState(0);

      // Hook: useEffect demonstrates component lifecycle & timer
      useEffect(() => {
        const interval = setInterval(() => {
          setSecondsActive((prev) => prev + 1);
        }, 1000);

        // Cleanup function
        return () => clearInterval(interval);
      }, []);

      // Event Handler
      const handleToggleWatch = (stockId) => {
        setStocks((prevStocks) =>
          prevStocks.map((s) =>
            s.id === stockId ? { ...s, isWatched: !s.isWatched } : s
          )
        );
      };

      return (
        <div style={{ backgroundColor: 'var(--card-color)', padding: '1.5rem', borderRadius: '8px', border: '1px solid var(--border-color)' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem' }}>
            <h2 style={{ fontSize: '1.25rem' }}>React Mini-Dashboard</h2>
            <span style={{ color: '#60a5fa', fontSize: '0.85rem' }}>
              ⏱ Active: {secondsActive}s (via useEffect)
            </span>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '1rem' }}>
            {stocks.map((stock) => (
              <StockCard
                key={stock.id}
                id={stock.id}
                symbol={stock.symbol}
                company={stock.company}
                price={stock.price}
                change={stock.change}
                isWatched={stock.isWatched}
                onToggleWatch={handleToggleWatch}
              />
            ))}
          </div>
        </div>
      );
    }

    // 3. Render into DOM
    const root = ReactDOM.createRoot(document.getElementById('react-root'));
    root.render(<StockPulseReactApp />);
  </script>

</body>
</html>
